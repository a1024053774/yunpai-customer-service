[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yunpai-customer-service"
version = "0.1.0"
description = "Standalone intelligent customer-service module: chat, memory, script matching, and self-evolution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1.0",
  "langgraph>=1.2,<2.0",
  "langgraph-checkpoint-sqlite>=3.1,<4.0",
  "pydantic>=2.10,<3.0",
  "pdfplumber>=0.11,<1.0",
]

[project.optional-dependencies]
dev = [
  "fastapi>=0.115,<1.0",
  "pytest>=8.3,<9.0",
  "python-multipart>=0.0.9,<1.0",
  "reportlab>=4.0,<5.0",
  "uvicorn[standard]>=0.34,<1.0",
]
demo = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "python-multipart>=0.0.9,<1.0",
]
pdf-advanced = [
  "docling>=2.0,<3.0",
]
rag-semantic = [
  "fastembed>=0.3,<1.0",
]
api = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.scripts]
yunpai-cs-demo = "yunpai_customer_service.demo.app:main"

[project.urls]
Source = "https://github.com/a1024053774/yunpai-customer-service"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yunpai_customer_service = ["*.json", "fixtures/*.json", "demo/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
