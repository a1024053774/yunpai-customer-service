<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>知识工作台 · 云派智能客服</title>
  <style>
    :root {
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Segoe UI", sans-serif;
      color: #1a1f24;
      background: #f5f6f8;
      --ink: #1a1f24;
      --muted: #66737c;
      --line: #e6e9ee;
      --teal: #0f6e68;
      --soft: #eaf6f4;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .shell { min-height: 100vh; }
    .top {
      height: 64px; padding: 0 clamp(16px, 4vw, 48px);
      display: flex; align-items: center; justify-content: space-between;
      background: #fff; color: var(--ink); border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; gap: 12px; align-items: center; }
    .mark {
      width: 36px; height: 36px; border-radius: 10px; background: var(--teal); color: #fff;
      display: grid; place-items: center; font-weight: 700;
    }
    .brand strong { display: block; font-size: 16px; }
    .brand span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .back {
      color: var(--ink); text-decoration: none; border: 1px solid var(--line);
      border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600; background: #fff;
    }
    .main { width: min(1120px, 100%); margin: auto; padding: 32px 20px 60px; }
    .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
    .hero h1 { margin: 0; font-size: 26px; letter-spacing: -.03em; }
    .hero p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    .scope { font-size: 12px; color: #475467; background: #fff; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; }
    .grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 16px; }
    .card {
      background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 20px;
      box-shadow: 0 1px 2px rgba(16,24,40,.04);
    }
    .card h2 { font-size: 15px; margin: 0 0 6px; }
    .card .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    .drop {
      border: 1px dashed #cdd5dc; border-radius: 14px; background: #fbfcfd;
      padding: 28px; text-align: center;
    }
    .drop input { display: none; }
    .drop label {
      display: inline-flex; cursor: pointer; background: var(--teal); color: #fff;
      padding: 10px 16px; border-radius: 10px; font-weight: 700; font-size: 13px;
    }
    .drop small { display: block; margin-top: 11px; color: var(--muted); }
    select {
      width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 10px;
      background: #fff; color: var(--ink);
    }
    button { font: inherit; cursor: pointer; }
    .primary {
      width: 100%; border: 0; background: var(--teal); color: #fff;
      padding: 11px; border-radius: 10px; font-weight: 700; margin-top: 14px;
    }
    .primary:disabled { opacity: .5; cursor: wait; }
    .statrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .stat { background: #f8fafb; padding: 12px; border-radius: 12px; }
    .stat b { display: block; font-size: 22px; }
    .stat span { font-size: 11px; color: var(--muted); }
    .list { display: grid; gap: 8px; max-height: 430px; overflow: auto; }
    .item { border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
    .item strong { display: block; font-size: 13px; }
    .mini {
      margin-top: 8px; border: 1px solid #cfe7e3; border-radius: 8px; background: #fff;
      color: var(--teal); padding: 5px 8px; font-size: 11px; font-weight: 600;
    }
    .mini:hover { background: var(--soft); }
    .item span { display: block; color: var(--muted); font-size: 11px; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tag { display: inline-block; margin-top: 7px; padding: 3px 7px; border-radius: 999px; background: var(--soft); color: var(--teal); font-size: 10px; font-weight: 700; }
    .empty { color: var(--muted); font-size: 13px; padding: 15px 0; }
    .notice { margin-top: 15px; font-size: 13px; padding: 10px 12px; border-radius: 10px; background: var(--soft); color: #0f6e68; }
    .notice.error { background: #fef3f2; color: #b42318; }
    @media (max-width: 760px) {
      .hero { display: block; }
      .scope { display: inline-block; margin-top: 14px; }
      .grid { grid-template-columns: 1fr; }
      .main { padding: 24px 14px 40px; }
      .top { padding: 0 14px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <div class="mark">云</div>
        <div>
          <strong>知识工作台</strong>
          <span>资料、产品与经验沉淀</span>
        </div>
      </div>
      <a class="back" href="/">返回客服</a>
    </header>
    <main class="main">
      <div class="hero">
        <div>
          <h1>知识库管理</h1>
          <p>导入产品资料与业务语料。PDF 走本地结构解析，不上传到第三方 RAG 服务。</p>
        </div>
        <div class="scope" id="scope">正在读取租户范围…</div>
      </div>
      <section class="grid">
        <div class="card">
          <h2>导入资料</h2>
          <p class="sub">支持 PDF、TXT、Markdown。优先用 Docling 识别版式和表格，缺页由 pdfplumber 补齐。</p>
          <form id="form">
            <div class="drop">
              <input id="file" type="file" accept=".pdf,.txt,.md">
              <label for="file">选择资料文件</label>
              <div id="filename" class="empty">尚未选择文件</div>
              <small>单文件 ≤ 20 MiB；导入后可在右侧查看来源并下载原件</small>
            </div>
            <label for="intent" class="sub" style="display:block;margin-top:16px">主要场景</label>
            <select id="intent">
              <option value="product_inquiry">商品与售前</option>
              <option value="after_sales">订单与售后</option>
              <option value="complaint">投诉与服务</option>
              <option value="chitchat">通用语料</option>
            </select>
            <button class="primary" id="submit" type="submit">导入并建立索引</button>
            <div id="notice" hidden></div>
          </form>
        </div>
        <div class="card">
          <h2>知识概览</h2>
          <p class="sub">当前租户的可检索资料与经验候选。</p>
          <div class="statrow">
            <div class="stat"><b id="docCount">—</b><span>已发布条目</span></div>
            <div class="stat"><b id="sourceCount">—</b><span>资料来源</span></div>
            <div class="stat"><b id="candidateCount">—</b><span>经验候选</span></div>
          </div>
          <button class="mini" id="reindex" type="button" style="margin:0 0 18px">按当前向量后端重建索引</button>
          <h2 style="font-size:14px;margin-top:20px">已上传文件</h2>
          <div id="files" class="list"><div class="empty">读取中…</div></div>
          <h2 style="font-size:14px;margin-top:20px">最近导入</h2>
          <div id="docs" class="list"><div class="empty">读取中…</div></div>
          <h2 style="font-size:14px;margin-top:20px">自进化候选</h2>
          <div id="candidates" class="list"><div class="empty">读取中…</div></div>
        </div>
      </section>
    </main>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
    async function load() {
      const [k, e, h, f] = await Promise.all([
        fetch("/api/knowledge"),
        fetch("/api/evolution/candidates"),
        fetch("/api/health"),
        fetch("/api/knowledge/files"),
      ]);
      const kd = await k.json();
      const ed = await e.json();
      const hd = await h.json();
      const fd = await f.json();
      const docs = kd.items || [];
      const cands = ed.items || [];
      $("docCount").textContent = docs.length;
      $("sourceCount").textContent = (fd.items || []).length || new Set(docs.map((x) => x.source?.split("#")[0])).size;
      $("candidateCount").textContent = cands.length;
      $("scope").textContent = "租户：" + (hd.tenant_id || "当前登录范围")
        + " · 领域：" + (hd.business_domain_label || hd.business_domain || "电商销售")
        + " · 向量：" + (hd.embedding_provider || "hash");
      $("files").innerHTML = (fd.items || []).map((x) =>
        `<div class="item"><strong>${esc(x.name)}</strong><span>${Math.round(x.size_bytes / 1024)} KiB · 已保存原件</span><a class="mini" href="/api/knowledge/files/${encodeURIComponent(x.name)}" download>下载原件</a></div>`
      ).join("") || '<div class="empty">暂无上传文件</div>';
      $("docs").innerHTML = docs.slice(0, 30).map((x) =>
        `<div class="item"><strong>${esc(x.question)}</strong><span>${esc(x.source)}</span><i class="tag">${esc(x.intent)} · ${esc(x.review_status || "approved")}</i></div>`
      ).join("") || '<div class="empty">暂无资料</div>';
      $("candidates").innerHTML = cands.slice(0, 20).map((x) =>
        `<div class="item" data-candidate="${esc(x.id)}"><strong>${esc(x.question)}</strong><span>${esc(x.status)} · ${esc(x.evidence_source || "待补充来源")}</span>${x.status === "pending" ? '<button class="mini" data-action="evaluate">评测</button>' : ""}${x.status === "evaluated" && x.gate_passed ? '<button class="mini" data-action="approve">批准发布</button>' : ""}${x.status === "approved" ? '<button class="mini" data-action="rollback">回滚</button>' : ""}</div>`
      ).join("") || '<div class="empty">暂无候选经验</div>';
    }
    $("reindex").addEventListener("click", async () => {
      const button = $("reindex");
      button.disabled = true;
      try {
        const r = await fetch("/api/knowledge/reindex", { method: "POST" });
        const d = await r.json();
        $("notice").hidden = false;
        $("notice").className = r.ok ? "notice" : "notice error";
        $("notice").textContent = r.ok ? `已重建 ${d.updated} 条索引（${d.embedding_provider}）` : (d.detail || "重建失败");
      } catch (err) {
        $("notice").hidden = false;
        $("notice").className = "notice error";
        $("notice").textContent = err.message;
      } finally {
        button.disabled = false;
      }
    });
    $("file").addEventListener("change", (e) => {
      $("filename").textContent = e.target.files[0]?.name || "尚未选择文件";
    });
    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const file = $("file").files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append("file", file);
      fd.append("intent", $("intent").value);
      $("submit").disabled = true;
      try {
        const r = await fetch("/api/knowledge/import", { method: "POST", body: fd });
        const d = await r.json();
        if (!r.ok) throw Error(d.detail || "导入失败");
        $("notice").hidden = false;
        $("notice").className = "notice";
        $("notice").textContent = `已导入 ${d.count} 个知识片段`;
        await load();
      } catch (err) {
        $("notice").hidden = false;
        $("notice").className = "notice error";
        $("notice").textContent = err.message;
      } finally {
        $("submit").disabled = false;
      }
    });
    load().catch(() => {
      $("docs").innerHTML = '<div class="empty">加载失败，请刷新重试</div>';
    });
    $("candidates").addEventListener("click", async (e) => {
      const button = e.target.closest("[data-action]");
      if (!button) return;
      const card = button.closest("[data-candidate]");
      if (!card) return;
      button.disabled = true;
      const action = button.dataset.action;
      const r = await fetch(`/api/evolution/candidates/${encodeURIComponent(card.dataset.candidate)}/${action}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: "{}",
      });
      if (!r.ok) {
        button.disabled = false;
        return;
      }
      await load();
    });
  </script>
</body>
</html>
